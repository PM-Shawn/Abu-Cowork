# Electron shell build — sign + notarize + (optionally) publish the update
# feed to OSS. Manual-trigger only: the Electron shell is not GA; this
# pipeline exists to validate the packaging/signing/updater chain end-to-end
# and to stage artifacts for real-machine verification.
#
# Secrets: reuses the EXACT set the Tauri Release workflow already has —
# APPLE_CERTIFICATE (base64 p12), APPLE_CERTIFICATE_PASSWORD,
# APPLE_API_KEY (the App Store Connect KEY ID), APPLE_API_ISSUER,
# APPLE_API_KEY_P8 (key file content), ALIYUN_ACCESS_KEY_ID,
# ALIYUN_ACCESS_KEY_SECRET, OSS_BUCKET, OSS_REGION. No new secrets needed.
#
# Signing: import the p12 into one explicit throwaway keychain BEFORE
# electron-builder starts. Its afterPack hook must sign nested extraResources
# before the outer app signature, so relying on electron-builder's later
# CSC_LINK import is too late. CSC_KEYCHAIN makes the nested and outer signing
# passes use the same keychain and Developer ID identity.
#
# Notarization: electron-builder's built-in @electron/notarize integration —
# activates automatically when APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER
# env vars are present (app-builder-lib macOptions `notarize`). Runs on the
# .app after signing, BEFORE dmg/zip are packed, so the artifacts contain the
# notarized app. We staple the .app + dmg afterwards (zip contents can't be
# stapled; Gatekeeper falls back to the online ticket check, same as VS Code's
# zips).
#
# ⚠️ First run needs watching — this workflow has never executed (it can only
# run after the electron branch lands on the default branch); treat the first
# green run, not this file, as the verification.
name: Electron Build

on:
  workflow_dispatch:
    inputs:
      publish_feed:
        description: 'Upload zip/dmg/latest-mac.yml to OSS under /electron/ (leave false for a build-only validation run)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest # arm64; add an x64/universal leg when Windows/Intel support lands
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup and verify bundled Node/Python runtimes
        run: |
          npm run setup:electron-runtimes
          npm run verify:electron-runtimes

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/electron-signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/electron-cert.p12"
          security import "$RUNNER_TEMP/electron-cert.p12" -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/electron-cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          EXISTING_KC="$(security list-keychains -d user | sed 's/[[:space:]"]//g' | tr '\n' ' ')"
          security list-keychains -d user -s "$KEYCHAIN" $EXISTING_KC
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Gates (build + lint + parity)
        run: |
          npm run build
          npm run lint
          npm run parity:check

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID_SECRET}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          echo "APPLE_API_KEY=$KEY_PATH" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID_SECRET" >> "$GITHUB_ENV"

      - name: Build, sign, notarize (zip + dmg + latest-mac.yml)
        env:
          # Notarization env (APPLE_API_KEY / APPLE_API_KEY_ID from GITHUB_ENV
          # above) + issuer:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: >-
          npm run dist:electron --
          --config.mac.identity="Developer ID Application"
          --config.mac.forceCodeSigning=true

      - name: Staple + verify
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          APP="release-electron/mac-arm64/Abu.app"
          DMG="$(ls release-electron/*.dmg | head -1)"
          xcrun stapler staple "$APP"
          # The dmg carries NO notarization ticket of its own — electron-builder
          # notarizes the .app BEFORE the dmg is packed — so stapling it directly
          # fails with Error 65 "Record not found" (hit on the real local run,
          # 2026-07-26). Submit the dmg itself first, then staple.
          xcrun notarytool submit "$DMG" \
            --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$DMG"
          echo "== stapler validate (app + dmg) =="
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          echo "== spctl assess (app) — fails the job if not notarized =="
          spctl -a -vvv --type execute "$APP"
          echo "== codesign deep verify =="
          codesign --verify --deep --strict "$APP"
          LAUNCHER="$APP/Contents/Resources/sandbox-launcher/darwin/sandbox-launcher"
          test -x "$LAUNCHER"
          echo "== nested sandbox-launcher signature =="
          codesign --verify --strict "$LAUNCHER"
          APP_TEAM="$(codesign -dv --verbose=4 "$APP" 2>&1 | sed -n 's/^TeamIdentifier=//p' | head -1)"
          LAUNCHER_TEAM="$(codesign -dv --verbose=4 "$LAUNCHER" 2>&1 | sed -n 's/^TeamIdentifier=//p' | head -1)"
          test -n "$APP_TEAM"
          test "$APP_TEAM" = "$LAUNCHER_TEAM"
          echo "nested launcher TeamIdentifier=$LAUNCHER_TEAM"
          echo "== every nested Mach-O is signed by the app team =="
          while IFS= read -r -d '' nested; do
            if file "$nested" | grep -q 'Mach-O'; then
              codesign --verify --strict "$nested"
              NESTED_TEAM="$(codesign -dv --verbose=4 "$nested" 2>&1 | sed -n 's/^TeamIdentifier=//p' | head -1)"
              test "$NESTED_TEAM" = "$APP_TEAM"
            fi
          done < <(find \
            "$APP/Contents/Resources/native-helper" \
            "$APP/Contents/Resources/sandbox-launcher" \
            "$APP/Contents/Resources/node-runtime" \
            "$APP/Contents/Resources/python-runtime" \
            -type f -print0)
          node scripts/verify-electron-runtimes.mjs \
            --resource-root "$APP/Contents/Resources"

      # Stapling rewrites the dmg bytes, so the sha512/size electron-builder
      # recorded in latest-mac.yml (and the dmg blockmap) are stale by now.
      # The zip is untouched (zips can't be stapled), so the updater's own
      # entry stays valid — this refresh keeps the dmg row honest too.
      - name: Refresh dmg hash in latest-mac.yml after stapling
        run: node scripts/electron-refresh-dmg-hash.mjs

      - name: Packaged smoke on the notarized build
        run: npm run smoke:electron:packaged

      - name: Upload artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: electron-mac-arm64
          path: |
            release-electron/*.zip
            release-electron/*.dmg
            release-electron/*.blockmap
            release-electron/latest-mac.yml
          retention-days: 14

      - name: Install + configure ossutil
        if: ${{ inputs.publish_feed }}
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          ossutil config \
            -e ${{ secrets.OSS_REGION }}.aliyuncs.com \
            -i ${{ secrets.ALIYUN_ACCESS_KEY_ID }} \
            -k ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}

      - name: Publish feed to OSS (/electron/ prefix)
        if: ${{ inputs.publish_feed }}
        run: |
          BUCKET="oss://${{ secrets.OSS_BUCKET }}"
          # Artifacts + blockmaps are content-addressed by version — plain copy.
          for f in release-electron/*.zip release-electron/*.dmg release-electron/*.blockmap; do
            [ -f "$f" ] || continue
            ossutil cp "$f" "${BUCKET}/electron/$(basename "$f")" -f
          done
          # The feed pointer must never be cached stale (mirrors the Tauri
          # latest.json upload).
          ossutil cp release-electron/latest-mac.yml "${BUCKET}/electron/latest-mac.yml" -f --meta "Cache-Control:no-cache"
          echo "Done. Listing:"
          ossutil ls "${BUCKET}/electron/"

      - name: Remove signing keychain
        if: ${{ always() }}
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ]; then
            security delete-keychain "$CSC_KEYCHAIN" || true
          fi
