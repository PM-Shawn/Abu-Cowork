name: E2E Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Normally ~2 min; see ci.yml's `check`.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Real-Electron E2E, fanned out across three macos-14 runners. The suite keeps
  # workers: 1 / fullyParallel: false: concurrent launches on one machine race
  # app.ready. Sharding across runners avoids reintroducing that race.
  # The matrix job reports as `e2e-electron-shard (1)`; the facade below carries
  # the required check context `e2e-electron`.
  # The suite pins the app to the zh-CN UI at launch (see
  # tests/e2e/electronHelpers.ts `--lang=zh-CN`), so the English system locale
  # of hosted runners does not change what the tests see.
  e2e-electron-shard:
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      # Surface every failure in one round instead of cancelling sibling shards.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust (native helper + sandbox launcher)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pinned Electron runtimes
        uses: actions/cache@v6
        with:
          path: electron/.runtime
          key: electron-runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-electron-runtimes.mjs') }}

      - name: Cache cargo builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            electron/native-helper/target
            electron/sandbox-launcher/target
          key: cargo-electron-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('electron/native-helper/Cargo.lock', 'electron/sandbox-launcher/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      # Not covered by the suite's global-setup (which prepares runtimes,
      # sidecar, and renderer) but required by the tool-approval specs.
      - name: Build sandbox launcher
        run: npm run build:sandbox-launcher

      - name: Run Electron E2E tests
        run: npm run test:e2e:electron -- --shard=${{ matrix.shard }}/3
        env:
          CI: true

      - name: Upload Electron E2E traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: electron-e2e-test-results-shard-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # Keep the required check context. Without always(), an upstream failure can
  # leave the facade skipped, silently bypassing the gate it exists to enforce.
  e2e-electron:
    needs: e2e-electron-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every Electron E2E shard to have succeeded
        env:
          SHARDS: ${{ needs['e2e-electron-shard'].result }}
        run: |
          echo "e2e-electron-shard result: $SHARDS"
          if [ "$SHARDS" != "success" ]; then
            echo "::error::Electron E2E shards did not all succeed ($SHARDS)"
            exit 1
          fi
