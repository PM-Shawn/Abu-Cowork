name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main, dev]
    # Re-evaluate body/label-based gate exemptions when their inputs change.
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

# Cancel a superseded run when the same pull request is pushed again. Keyed on
# github.sha off pull requests (not github.ref): a ref-keyed group would make
# successive dev pushes queue behind each other, because cancel-in-progress is
# deliberately false there — a post-merge run is the signal that dev is healthy
# and must never be cancelled by the next merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Runs without installing dependencies; its result independently gates check,
  # so a build or test pass cannot mask a leak. Uses `git ls-files --cached --others`, which
  # reads the index and working tree — a shallow checkout is enough.
  leak-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Enterprise leak guard (open-core)
        run: bash scripts/enterprise-leak-guard.sh

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: install
        run: |
          npm ci
          (cd abu-browser-bridge && npm ci)
          (cd abu-chrome-extension && npm ci)
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: install
        run: |
          npm ci
          (cd abu-browser-bridge && npm ci)
          (cd abu-chrome-extension && npm ci)
      - name: Type check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run typecheck

  # The only job that writes through GITHUB_TOKEN, and the only one that needs
  # full git history (changed-line coverage diffs against the PR base).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: install
        run: |
          npm ci
          (cd abu-browser-bridge && npm ci)
          (cd abu-chrome-extension && npm ci)

      - name: Set quarantine SLA as-of date
        run: echo "QUARANTINE_ASOF=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Test with coverage
        id: test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:coverage

      - name: Changed-lines coverage (80%)
        if: ${{ github.event_name == 'pull_request' && !cancelled() && steps.install.outcome == 'success' }}
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run coverage:changed -- --base "$DIFF_BASE"

      - name: Test-infra scripts (node:test)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:infra

      - name: Electron host UI tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run electron:host-ui-test

      - name: TESTING.md inventory is up to date
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run test:inventory:check

      - name: Official plugin market validates
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run market:check

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload test results (junit)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

      # The two steps below write through GITHUB_TOKEN (checks / PR comments).
      # That token is read-only on Dependabot PRs and on fork PRs, so the
      # actions would fail with "Resource not accessible by integration" and red
      # this whole job — which would also silently disable dependabot-auto-merge
      # (it waits on the `check` context, which this job feeds).
      - name: Test report (junit → check)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@v2
        with:
          name: Vitest results
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false
          use-actions-summary: false

      - name: Coverage summary (job summary)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${s[k].pct}% (${s[k].covered}/${s[k].total}) |`;
            console.log("### Coverage\n\n| Metric | Value |\n|---|---|");
            for (const k of ["statements","branches","functions","lines"]) console.log(row(k));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Coverage comment on PR
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-path: coverage/coverage-summary.json
          json-final-path: coverage/coverage-final.json
          file-coverage-mode: changes

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        id: install
        run: |
          npm ci
          (cd abu-browser-bridge && npm ci)
          (cd abu-chrome-extension && npm ci)

      - name: Build frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Verify Chrome extension bundle is in sync with source
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          npm run build:electron-browser-runtime
          if ! diff -r --exclude='*.map' \
              abu-chrome-extension/dist \
              src-tauri/browser-extension > /tmp/ext-diff.txt 2>&1; then
            echo "::error::Chrome extension bundle is out of sync with source."
            echo ""
            echo "--- Differences ---"
            cat /tmp/ext-diff.txt
            echo ""
            echo "--- Fix ---"
            echo "cd abu-chrome-extension && npm run build"
            echo "cd .. && npm run copy-resources"
            echo "git add src-tauri/browser-extension/ && commit"
            exit 1
          fi
          echo "OK: Chrome extension bundle matches source"
          node --input-type=module -e "import { recordSourceDigest } from './scripts/check-browser-artifacts.mjs'; recordSourceDigest('src-tauri/browser-extension/content.js');"
          npm run check:browser-artifacts

  # Facade carrying the required check context `check`. Branch protection on
  # dev requires this exact name, so the parallel jobs above deliberately do
  # NOT use it. `if: always()` is load-bearing: without it this job is SKIPPED
  # when an upstream job fails, and a skipped required check can be treated as
  # success — silently bypassing the gate.
  check:
    needs: [leak-guard, lint, typecheck, test, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require every gate job to have succeeded
        env:
          RESULTS: >-
            leak-guard=${{ needs['leak-guard'].result }}
            lint=${{ needs['lint'].result }}
            typecheck=${{ needs['typecheck'].result }}
            test=${{ needs['test'].result }}
            build=${{ needs['build'].result }}
        run: |
          echo "gate results: $RESULTS"
          for pair in $RESULTS; do
            if [ "${pair#*=}" != "success" ]; then
              echo "::error::A required gate job did not succeed — $RESULTS"
              exit 1
            fi
          done
          echo "All gate jobs succeeded."

  # Windows unit tests — ADVISORY for now. This suite has never run on Windows
  # in CI; the first runs will surface path-sensitive tests. Triage them
  # (skipIf(process.platform === 'win32') + issue) and then drop
  # continue-on-error in a follow-up PR. See docs/abu-testing-optimization-plan-2026-09.md A4.
  test-windows:
    runs-on: windows-latest
    continue-on-error: true
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          (cd abu-browser-bridge && npm ci)
      - name: Set quarantine SLA as-of date
        shell: bash
        run: echo "QUARANTINE_ASOF=$(date -u +%F)" >> "$GITHUB_ENV"
      # The config's junit reporter writes test-results/junit.xml; the artifact
      # name (test-results-windows) disambiguates it from the Linux run. A CLI
      # --outputFile would be inert here: in Vitest 4.1 a named --reporter keeps
      # its config-file options, and JUnitReporter reads options.outputFile first.
      - name: Unit tests (no coverage)
        shell: bash
        run: npx vitest run
      - name: Upload Windows test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: test-results/
          retention-days: 14

  # Dependency vulnerability scan. Fails on any high/critical production
  # finding that is not covered by an unexpired entry in
  # .github/npm-audit-allowlist.json (scripts/npm-audit-check.mjs) — the
  # allowlist exists because some advisories have no patched version at all.
  # Not a required status check yet (branch protection only requires `check`).
  audit:
    runs-on: ubuntu-latest
    # Normally seconds; see `check`.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: npm audit (production deps, high+, allowlist-aware)
        run: |
          # npm audit exits non-zero whenever it finds anything; the checker decides.
          npm audit --omit=dev --json > audit.json || true
          node scripts/npm-audit-check.mjs audit.json | tee -a "$GITHUB_STEP_SUMMARY"
          status=${PIPESTATUS[0]}
          exit "$status"
