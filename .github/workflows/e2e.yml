name: E2E Tests

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Real-Electron E2E (tests/e2e/, playwright.electron.config.ts). Until this
  # job existed, the Electron suite ran nowhere in CI — a green "E2E Tests"
  # check only covered the browser suite above, so desktop-only regressions
  # (e.g. the composer pending-send drop fixed in 03c35086) shipped invisibly.
  # The suite pins the app to the zh-CN UI at launch (see
  # tests/e2e/electronHelpers.ts `--lang=zh-CN`), so the English system locale
  # of hosted runners does not change what the tests see.
  e2e-electron:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust (native helper + sandbox launcher)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache pinned Electron runtimes
        uses: actions/cache@v4
        with:
          path: electron/.runtime
          key: electron-runtimes-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup-electron-runtimes.mjs') }}

      - name: Cache cargo builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            electron/native-helper/target
            electron/sandbox-launcher/target
          key: cargo-electron-e2e-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('electron/native-helper/Cargo.lock', 'electron/sandbox-launcher/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci

      # Not covered by the suite's global-setup (which prepares runtimes,
      # sidecar, and renderer) but required by the tool-approval specs.
      - name: Build sandbox launcher
        run: npm run build:sandbox-launcher

      - name: Run Electron E2E tests
        run: npm run test:e2e:electron
        env:
          CI: true

      # TEMPORARY diagnostics: capabilities.spec.ts:187 hangs on this runner
      # inside computer_use_begin_session → check_macos_permissions (each
      # native-helper call burns the 30s CALL_TIMEOUT). Probe the helper binary
      # and the two underlying TCC APIs directly to find which layer blocks.
      # Remove this step once the root cause is fixed.
      - name: Diagnose native-helper TCC probes (temporary)
        if: always()
        run: |
          BIN=electron/native-helper/target/release/native-helper
          if [ ! -x "$BIN" ]; then echo "helper binary missing — global setup did not build it"; exit 0; fi
          echo "--- helper: hello + check_macos_permissions (25s cap) ---"
          printf '%s\n' \
            '{"id":1,"method":"hello","params":{}}' \
            '{"id":2,"method":"check_macos_permissions","params":{}}' \
            | perl -e 'alarm shift; exec @ARGV' 25 "$BIN" || echo "helper probe exit: $?"
          echo "--- swift CGPreflightScreenCaptureAccess (60s cap) ---"
          perl -e 'alarm shift; exec @ARGV' 60 swift -e 'import CoreGraphics; print("preflight:", CGPreflightScreenCaptureAccess())' || echo "swift CG probe exit: $?"
          echo "--- swift AXIsProcessTrusted (60s cap) ---"
          perl -e 'alarm shift; exec @ARGV' 60 swift -e 'import ApplicationServices; print("axtrusted:", AXIsProcessTrusted())' || echo "swift AX probe exit: $?"
          echo "--- SIP status ---"
          csrutil status || true
          echo "--- user TCC.db readability ---"
          sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" 'SELECT count(*) FROM access;' || echo "user TCC.db not readable"
          echo "--- system TCC.db readability ---"
          sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" 'SELECT count(*) FROM access;' || echo "system TCC.db not readable"

      - name: Upload Electron E2E traces
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: electron-e2e-test-results
          path: test-results/
          retention-days: 7
