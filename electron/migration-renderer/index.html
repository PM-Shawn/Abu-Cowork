<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abu safe upgrade</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #2d2926;
        background: #faf8f3;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }
      main {
        width: min(440px, calc(100vw - 56px));
        text-align: center;
      }
      .mark {
        width: 58px;
        height: 58px;
        margin: 0 auto 24px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: #f4ded2;
        color: #d97452;
        font-size: 28px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 24px;
        font-weight: 650;
      }
      p {
        margin: 0;
        color: #766e68;
        line-height: 1.65;
        font-size: 14px;
      }
      .progress {
        height: 7px;
        margin: 30px 0 18px;
        overflow: hidden;
        border-radius: 999px;
        background: #e9e3dc;
      }
      .progress::after {
        content: "";
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: #db7958;
        animation: moving 1.35s ease-in-out infinite;
      }
      .meta {
        font-size: 12px;
        color: #9b9189;
      }
      @keyframes moving {
        from { transform: translateX(-110%); }
        to { transform: translateX(350%); }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">A</div>
      <h1 id="title">正在安全升级阿布</h1>
      <p id="description">正在备份并迁移聊天、设置、密钥、MCP 和浏览器连接。旧版数据不会被删除。</p>
      <div class="progress" aria-label="progress"></div>
      <div class="meta" id="meta"></div>
    </main>
    <script>
      const query = new URLSearchParams(location.search);
      const isEnglish = query.get('locale') === 'en-US';
      const files = query.get('files') || '0';
      const size = query.get('size') || '0 MB';
      if (isEnglish) {
        document.documentElement.lang = 'en-US';
        document.getElementById('title').textContent = 'Safely upgrading Abu';
        document.getElementById('description').textContent =
          'Backing up and migrating chats, settings, secrets, MCP, and the browser connection. Legacy data will not be deleted.';
        document.getElementById('meta').textContent = `${files} files · ${size}`;
      } else {
        document.getElementById('meta').textContent = `${files} 个文件 · ${size}`;
      }
    </script>
  </body>
</html>
