name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# A queued older tag must never overwrite a newer production pointer.
concurrency:
  group: abu-production-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate version, changelogs, and release staging logic
        run: |
          node scripts/release-preflight.mjs --tag "${{ github.ref_name }}"
          npm run test:electron:release-stage

  # v0.34.x is the frozen bridge consumed by the hard-coded legacy Tauri
  # latest.json. Later releases keep dormant direct-install migration support
  # but do not create or publish a new Tauri transition pointer.
  electron-transition:
    needs: preflight
    uses: ./.github/workflows/electron-build.yml
    with:
      transition_version: ${{ github.ref_name }}
      transition_release: ${{ startsWith(github.ref_name, 'v0.34.') }}
      legacy_migration_support: true
    secrets: inherit

  publish:
    needs: [preflight, electron-transition]
    # RC tags exercise the complete native build but never alter production.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Electron macOS arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: electron-mac-arm64
          path: release-input/mac-arm64

      - name: Download Electron macOS x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: electron-mac-x64
          path: release-input/mac-x64

      - name: Download Electron Windows x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: electron-windows-x64
          path: release-input/windows-x64

      - name: Stage and verify all transition and self-update artifacts
        env:
          VERSION_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          LEGACY_TRANSITION: ${{ startsWith(github.ref_name, 'v0.34.') }}
        run: |
          node scripts/stage-electron-transition-release.mjs \
            --input release-input \
            --output release-stage \
            --version "$VERSION_TAG" \
            --repo "$REPOSITORY" \
            --release-base-url "https://abu-agent.oss-cn-beijing.aliyuncs.com/releases/$VERSION_TAG" \
            --changelog-en CHANGELOG.md \
            --changelog-zh CHANGELOG.zh-CN.md \
            --legacy-transition "$LEGACY_TRANSITION"
          node -e '
            const fs = require("node:fs");
            const legacy = process.env.LEGACY_TRANSITION === "true";
            if (!legacy) {
              if (fs.existsSync("release-stage/latest.json")) {
                throw new Error("normal Electron release must not stage legacy latest.json");
              }
              process.exit(0);
            }
            const latest = JSON.parse(fs.readFileSync("release-stage/latest.json", "utf8"));
            const expected = ["darwin-aarch64", "darwin-x86_64", "windows-x86_64"];
            if (JSON.stringify(Object.keys(latest.platforms).sort()) !== JSON.stringify(expected)) {
              throw new Error("latest.json does not contain exactly the three release platforms");
            }
          '

      - name: Prepare draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          VER="${TAG#v}"
          NOTES="$(awk -v ver="## v${VER}" 'index($0, ver)==1{f=1;next} /^## v/{if(f)exit} f' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="See the assets below for download links."
          fi
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" --draft \
              --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release edit "$TAG" --repo "${{ github.repository }}" \
            --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release upload "$TAG" release-stage/release-assets/* \
            --repo "${{ github.repository }}" --clobber

      - name: Install and configure ossutil
        run: |
          curl -fsSL https://gosspublic.alicdn.com/ossutil/install.sh | sudo bash
          ossutil config \
            -e "${{ secrets.OSS_REGION }}.aliyuncs.com" \
            -i "${{ secrets.ALIYUN_ACCESS_KEY_ID }}" \
            -k "${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}"

      # Upload immutable/versioned bytes first. Pointer files are withheld until
      # every referenced byte has been downloaded back and compared.
      - name: Upload immutable release and updater artifacts
        env:
          BUCKET: oss://${{ secrets.OSS_BUCKET }}
        run: |
          while IFS=$'\t' read -r local remote; do
            test -n "$local"
            test -s "release-stage/$local"
            ossutil cp "release-stage/$local" "$BUCKET/$remote" -f
          done < release-stage/content-map.tsv

      - name: Verify uploaded immutable bytes
        env:
          BUCKET: oss://${{ secrets.OSS_BUCKET }}
        run: |
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          INDEX=0
          while IFS=$'\t' read -r local remote; do
            test -n "$local"
            INDEX=$((INDEX + 1))
            downloaded="$VERIFY_DIR/$INDEX"
            ossutil cp "$BUCKET/$remote" "$downloaded" -f
            cmp "release-stage/$local" "$downloaded"
          done < release-stage/content-map.tsv

      - name: Publish and verify the three Electron feed pointers
        env:
          BUCKET: oss://${{ secrets.OSS_BUCKET }}
        run: |
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          INDEX=0
          while IFS=$'\t' read -r local remote; do
            test -n "$local"
            INDEX=$((INDEX + 1))
            ossutil cp "release-stage/$local" "$BUCKET/$remote" \
              -f --meta "Cache-Control:no-cache"
            downloaded="$VERIFY_DIR/$INDEX"
            ossutil cp "$BUCKET/$remote" "$downloaded" -f
            cmp "release-stage/$local" "$downloaded"
          done < release-stage/feed-pointer-map.tsv

      # This is the only operation that makes existing Tauri installations see
      # the framework transition. It runs after all three new Electron feeds and
      # all transition artifacts are durable and byte-verified.
      - name: Switch the frozen production Tauri bridge pointer last
        if: ${{ startsWith(github.ref_name, 'v0.34.') }}
        env:
          BUCKET: oss://${{ secrets.OSS_BUCKET }}
        run: |
          VERSION="${{ github.ref_name }}"
          PREVIOUS_LATEST="$(mktemp)"
          VERIFY_FILE="$(mktemp)"
          restore_previous_pointer() {
            status=$?
            if [ "$status" -ne 0 ] && [ -s "$PREVIOUS_LATEST" ]; then
              echo "New latest.json verification failed; restoring the previous pointer" >&2
              ossutil cp "$PREVIOUS_LATEST" "$BUCKET/latest.json" \
                -f --meta "Cache-Control:no-cache" || true
            fi
            rm -f "$PREVIOUS_LATEST" "$VERIFY_FILE"
            exit "$status"
          }
          trap restore_previous_pointer EXIT
          ossutil cp "$BUCKET/latest.json" "$PREVIOUS_LATEST" -f
          node scripts/validate-electron-transition-version.mjs \
            --candidate "${VERSION#v}" \
            --latest-url "https://abu-agent.oss-cn-beijing.aliyuncs.com/latest.json" \
            --allow-equal true
          ossutil cp release-stage/latest.json "$BUCKET/latest.json" \
            -f --meta "Cache-Control:no-cache"
          ossutil cp "$BUCKET/latest.json" "$VERIFY_FILE" -f
          cmp release-stage/latest.json "$VERIFY_FILE"
          curl -fsS --retry 5 --retry-all-errors \
            "https://abu-agent.oss-cn-beijing.aliyuncs.com/latest.json?release=${GITHUB_RUN_ID}" \
            -o "$VERIFY_FILE"
          cmp release-stage/latest.json "$VERIFY_FILE"
          trap - EXIT
          rm -f "$PREVIOUS_LATEST" "$VERIFY_FILE"

      - name: Publish GitHub Release after production verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" --draft=false

      - name: Upload the release audit manifest
        uses: actions/upload-artifact@v4
        with:
          name: electron-release-audit-${{ github.ref_name }}
          path: |
            release-stage/release-manifest.json
            release-stage/content-map.tsv
            release-stage/feed-pointer-map.tsv
            release-stage/latest.json
          if-no-files-found: error
          retention-days: 90
