version: 2
updates:
  # ---- Rust (Cargo) — RETIRED ---------------------------------------------
  # src-tauri is a frozen compatibility/migration path (see AGENTS.md): no new
  # Tauri builds are cut, so Tauri dependency bumps never ship anywhere and were
  # pure PR noise. Dependabot no longer scans /src-tauri. If a Tauri migration
  # build is ever cut again, re-add a `cargo` / `directory: /src-tauri` entry.

  # ---- npm ---------------------------------------------------------------
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-patch:
        patterns: ["*"]
        update-types: ["patch"]
      npm-minor:
        patterns: ["*"]
        update-types: ["minor"]

  # ---- GitHub Actions ----------------------------------------------------
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(ci)"
    # Action pin bumps are low blast radius — batch them all and auto-merge.
    groups:
      actions-all:
        patterns: ["*"]
